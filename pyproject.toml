[project]
name = "vdu-benchmarks"
version = "0.1.0"
description = "Reproducible visual document retrieval and RAG benchmarks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.1",
    "jupyter>=1.1.1",
    "langchain>=1.4.0",
    "llama-index>=0.14.24",
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-vector-stores-qdrant>=0.10.3",
    "loguru>=0.7.3",
    "matplotlib>=3.11.1",
    "openai>=2.54.0",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "asyncpg>=0.30.0",
    "alembic>=1.16.0",
    "minio>=7.2.0",
    "typer>=0.16.0",
    "pyyaml>=6.0.2",
    "ragas==0.4.3",
    "ir-measures==0.4.3",
    "fastembed==0.8.0",
    "rapidfuzz>=3.0.0",
    "sacrebleu>=2.0.0",
    "rouge-score>=0.1.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.0",
    "sqlalchemy>=2.0.52",
    "tenacity>=9.1.4",
    "tqdm>=4.70.0",
    "langchain-community==0.3.31",
    "langchain-openai>=1.6.2",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
vdu = "src.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL, MinIO, and Qdrant services"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
