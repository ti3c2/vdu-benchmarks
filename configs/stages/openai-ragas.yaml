# For vdu evaluate ragas with a generation run; uses its saved OCR contexts.
ragas_max_concurrency: 4
metrics:
  - id: exact_match
  - id: factual_correctness
  - id: faithfulness
  - id: context_precision_with_reference
  - id: context_recall
judge:
  model: gpt-4.1-mini-2025-04-14
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
