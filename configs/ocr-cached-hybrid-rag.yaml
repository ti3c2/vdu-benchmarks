# Full RAG counterpart of ocr-cached-hybrid.yaml. See docs/rag-evaluation.md.
name: ocr-cached-hybrid-rag
dataset_id: 00000000-0000-0000-0000-000000000000
queries:
  rephrase_levels: [0]
preprocess:
  ocr_text_path: data/processed/20260907-212356_ibm-research-REAL-MM-RAG_FinReport_BEIR_deepseek-ai/i2t/DeepSeek-OCR-2_deepseek-ocr_i2t.csv
embeddings:
  dense:
    endpoint:
      model: qwen/qwen3-embedding-8b
      base_url: https://openrouter.ai/api/v1
      api_key_env: EMBEDDING_API_KEY
    space_id: qwen3-embedding-8b-dense-v1
    dimensions: 1024
  sparse:
    model: Qdrant/bm25
corpus_unit: chunk
retrieval:
  mode: hybrid
  page_top_k: 20
generation:
  endpoint:
    model: gpt-4.1-mini-2025-04-14
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    concurrency: 4
  context:
    representations: [ocr]
    page_top_k: 5
  temperature: 0
  max_tokens: 2048
ir:
  cutoffs: [1, 5, 10, 20]
ragas:
  ragas_max_concurrency: 4
  metrics:
    - id: exact_match
    - id: factual_correctness
    - id: faithfulness
    - id: context_precision_with_reference
    - id: context_recall
  judge:
    model: gpt-4.1-mini-2025-04-14
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
# To use saved retrievals, uncomment and replace with a completed retrieval run UUID.
# Keep the dataset, query selection, and upstream settings identical to that run.
# reuse:
#   retrieval: 00000000-0000-0000-0000-000000000000
